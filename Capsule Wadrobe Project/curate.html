    <header>

        <nav>

          </ul>

    </header>   
    <div class="container">
        <h2>Style Consultation </h2>
        <p>Tell us your dimensions to find your flattering match.</p>
        <form>
                <label for="fullname">Full Name </label>
                <input type="text" id="fullname"name="fullname"placeholder="E.g., Jane Doe"required>

                <label for="useremail">Email Address</label>
                <input type="email" id="useremail" name="useremail" placeholder="name@example.com"required>

                <label> Your Size</label>
                <select>
                    <option> Small (S)</option>
                    <option>Medium(M)</option>
                    <option>Large(L)</option>
                    <option>Extra Large(XL)</option>
                </select>
                <label>Your Body Type</label>
                <select>
                    <option>Hourglass(Balanced top & bottom)</option>
                    <option >Pear(Wider hips)</option>
                    <option>Rectangle(Straight silohouette)</option>
                    <option>Apple(Weight around the midsection)</option>
                </select>
            <button type="button">Find my Perfect Clothes</button>
        </form>

    </div>
